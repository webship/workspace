<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t { fill: #1b2a4a; font-size: 14px; }
      .h { fill: #1b2a4a; font-size: 17px; font-weight: 600; }
      .m { fill: #5b6b85; font-size: 12px; }
      .box { fill: #ffffff; stroke: #c9d3e3; stroke-width: 1.5; rx: 10; }
      .core { fill: #eef3ff; stroke: #2f6fed; stroke-width: 2; rx: 12; }
      .fam { fill: #f7f9fc; stroke: #c9d3e3; stroke-width: 1.5; rx: 10; }
      .pill { fill: #ffffff; stroke: #2f6fed; stroke-width: 1.2; rx: 14; }
      .pt { fill: #2f6fed; font-size: 12px; font-weight: 600; }
      .line { stroke: #2f6fed; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- the core -->
  <rect x="30" y="40" width="300" height="340" class="core"/>
  <text x="50" y="72" class="h">@webship.co/workspace</text>
  <text x="50" y="92" class="m">the core — ships empty</text>
  <rect x="50" y="112" width="260" height="52" class="box"/>
  <text x="64" y="134" class="t">Dashboard</text>
  <text x="64" y="152" class="m">node:http + HTMX, in a DDEV container</text>
  <rect x="50" y="176" width="260" height="52" class="box"/>
  <text x="64" y="198" class="t">Plugin system</text>
  <text x="64" y="216" class="m">require · activate · install · configure</text>
  <rect x="50" y="240" width="260" height="52" class="box"/>
  <text x="64" y="262" class="t">Settings, workspaces list, builders, jobs</text>
  <text x="64" y="280" class="m">core/config · core/scripts · screen sessions</text>
  <rect x="50" y="304" width="260" height="52" class="box"/>
  <text x="64" y="326" class="t">webship-workspace</text>
  <text x="64" y="344" class="m">init · plugin · catalog · update</text>

  <!-- arrows -->
  <path d="M330,120 C380,120 380,86 420,86" class="line"/>
  <path d="M330,200 C380,200 380,186 420,186" class="line"/>
  <path d="M330,260 C380,260 380,286 420,286" class="line"/>
  <path d="M330,330 C380,330 380,366 420,366" class="line"/>

  <!-- families -->
  <rect x="420" y="56" width="510" height="60" class="fam"/>
  <text x="436" y="80" class="t">Workspace folders</text>
  <text x="436" y="98" class="m">dev · test · drupal-modules · drupal-themes · docs · images · ai-agents · graph · rag …</text>

  <rect x="420" y="156" width="510" height="60" class="fam"/>
  <text x="436" y="180" class="t">Hosting providers</text>
  <text x="436" y="198" class="m">upsun · acquia · digitalocean · cpanel · aws · azure · godaddy — one base, one button per provider</text>

  <rect x="420" y="256" width="250" height="60" class="fam"/>
  <text x="436" y="280" class="t">Git forges</text>
  <text x="436" y="298" class="m">github · gitlab · bitbucket</text>

  <rect x="680" y="256" width="250" height="60" class="fam"/>
  <text x="696" y="280" class="t">Container runtimes</text>
  <text x="696" y="298" class="m">docker · lando · docksal · podman · k8s</text>

  <rect x="420" y="336" width="510" height="60" class="fam"/>
  <text x="436" y="360" class="t">Features</text>
  <text x="436" y="378" class="m">git · ide · jira · google-drive · testing · webship-js · drupal · wordpress · odoo · microsoft · apple</text>

  <!-- the pill -->
  <rect x="600" y="8" width="330" height="28" class="pill"/>
  <text x="614" y="27" class="pt">each one an npm package: @webship.co/workspace-&lt;name&gt;</text>
</svg>
