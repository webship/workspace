doc:
  name: graphs

# Knowledge graphs of a project's code, one directory per project:
#   graphs/<workspace>/<project>/
# They live HERE rather than inside the project on purpose: a graph is tens of megabytes, its
# clustering is not bit-stable so every rebuild diffs in full, and half the projects worth mapping
# are repositories we ship — one must not gain a graph directory because somebody mapped it.
presentation:
  icon: tabler:hierarchy-2
  subtitle: Project Knowledge Graphs
  noun: graph
  kind: files

# What this folder's items ARE, which decides what the dashboard offers on each row:
#   sites     — real projects with a DDEV environment: build, start, back up, graph, index
#   code      — repositories checked out to work on, without a site of their own
#   files     — markdown documents, edited in place
#   ai-items  — agents, skills and prompts, installable into ~/.claude
#   media     — recordings and images
type: code
