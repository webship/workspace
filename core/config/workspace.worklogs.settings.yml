doc:
  name: worklogs

# What this folder's projects are, and which actions their rows offer:
# sites | code | files | media | ai-items — see core/workspace-app/WORKSPACES.md.
type: files

# What the assistant is called on THIS workspace's page, and what its composer says when empty.
# `default` in either means "whatever settings.yml says" — the global value, so a rename there
# still reaches this page. Set a value here to override it for this workspace alone.
assistant:
  name: default
  placeholder: default

presentation:
  icon: tabler:history
  subtitle: Session Worklogs
  noun: worklog
  kind: files

# What this folder's items ARE, which decides what the dashboard offers on each row:
#   sites     — real projects with a DDEV environment: build, start, back up, graph, index
#   code      — repositories checked out to work on, without a site of their own
#   files     — markdown documents, edited in place
#   ai-items  — agents, skills and prompts, installable into ~/.claude
#   media     — recordings and images
