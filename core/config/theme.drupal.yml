  surface-input: "#0b1c45"
  text-default: "#eaf6fd"
  text-subtle-2: "#ccedf9"
  text-subtle: "#a2acbe"
  line: "#2b3c6f"
  line-strong: "#44578f"
  link: "#6fd0f7"
  brand-pressed: "#57c4f2"
  brand-2-pressed: "#1b2b4d"
  focus-ring: "#ccbaf466"
  ok-soft: "#12401a"
  ok-ink: "#a8e6b8"
  danger-soft: "#4a1414"
  danger-ink: "#ffb3b3"
  danger-armed: "#e0466b"
  danger-text: "#ff8fa3"
  warning-soft: "#3f3008"
  warning-ink: "#f4d58a"
  info-soft: "#123a63"
  info-ink: "#9fe2fb"
  success-soft: "#10291d"
  success-ink: "#a3d9bd"
  busy-soft: "#1a2440"
  busy-ink: "#b9c9ff"
  accent-soft: "#2a2360"
