# Every token the "ember" theme sets — core/config/theme.ember.yml
#
# Ember. A theme is a palette: it declares custom properties and selects nothing, so every
# value in it is configuration. They are all here, editable on the Settings screen, rather than
# only by editing a stylesheet inside the app.
#
# Names go without the leading dashes. `tokens:` applies to both halves; `dark:` applies to the
# dark half only, exactly like the html.dark block in a theme file. Anything here overrides the
# theme CSS, which is what you get with no YAML at all.

tokens:
  brand-primary: "var(--brand-secondary)"
  brand-secondary: "#b45309"
  brand-accent: "#ea580c"
  brand-grad: "linear-gradient(135deg, var(--brand-primary), var(--brand-secondary) 65%, var(--brand-accent))"
  text-default: "#292524"
  text-subtle-2: "#57534e"
  text-subtle: "#8a827c"
  surface: "#faf7f2"
  surface-card: "#fff"
  surface-muted: "#f2ece3"
  line: "#e7ded1"
  line-strong: "#d3c4ae"
  ok: "#4d7c0f"
  ok-soft: "#f5f9ec"
  pcard-tool-label: 0rem
  ok-ink: "#33501a"
  danger: "#b91c1c"
  danger-soft: "#fdf2f2"
  danger-ink: "#7f1d1d"
  danger-armed: "#991b1b"
  danger-text: "#b91c1c"
  warning: "#d97706"
  warning-soft: "#fdf3e0"
  warning-ink: "#7c4a03"
  info: "#0e7490"
  info-soft: "#e6f4f7"
  info-ink: "#164e63"
  success: "#146c43"
  success-soft: "#d0e2d9"
  success-ink: "#0f5132"
  link: "#b45309"
  subtle-brand: "#fdf4e7"
  busy-soft: "#fbf0dd"
  busy-ink: "var(--brand-secondary)"
  subtle-light: "#fdfbf7"
  brand-1: "var(--brand-primary)"
  brand-2: "var(--brand-secondary)"
  font-code: "\"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace"
  font-primary: "Figtree, \"Helvetica Neue\", Arial, sans-serif"
  font-secondary: "\"DM Serif Text\", Georgia, serif"
  ink: "var(--brand-secondary)"
  leading-body: 1.6
  leading-display: 1.3
  leading-heading: 1.4
  size-body: 0.9375rem
  size-h1: 2rem
  size-h2: 1.625rem
  size-h3: 1.5rem
  size-h4: 1.25rem
  size-h5: 1.125rem
  size-h6: 1rem
  subtle-accent: "#fdf6ec"
  weight-regular: 400
  weight-semibold: 600
  tracking-wide: 0.0625em
  size-small: 0.875rem
  type-h1: "var(--weight-regular) var(--size-h1)/1.15 var(--font-secondary)"
  type-h2: "var(--weight-regular) var(--size-h2)/1.2 var(--font-secondary)"
  type-h3: "var(--weight-semibold) var(--size-h3)/1.25 var(--font-primary)"
  type-h4: "var(--weight-semibold) var(--size-h4)/1.3 var(--font-primary)"
  type-h5: "var(--weight-semibold) var(--size-h5)/1.35 var(--font-primary)"
  type-h6: "var(--weight-semibold) var(--size-h6)/1 var(--font-primary)"
  type-body: "var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-primary)"
  type-body-sm: "var(--weight-regular) var(--size-small)/1.45 var(--font-primary)"
  type-label: "var(--weight-semibold) var(--size-body)/1 var(--font-primary)"
  type-caption: "var(--weight-regular) var(--size-small)/1.35 var(--font-primary)"
  type-mono: "var(--weight-regular) var(--size-body)/1.5 var(--font-code)"
  type-mono-sm: "var(--weight-regular) var(--size-small)/1.4 var(--font-code)"
  tracking-h1: normal
  tracking-h2: normal
  tracking-h3: normal
  tracking-h4: normal
  tracking-h5: normal
  tracking-h6: "var(--tracking-wide)"
  brand-3: "var(--brand-accent)"
  brand-dark: "#1c1410"
  brand-light: "#f5ede2"
  text-inverse: "#ffffff"
  text-light: "#f5ede2"
  text-brand: "var(--brand-primary)"
  text-accent: "var(--brand-accent)"
  surface-input: "#ffffff"
  brand-pressed: "#a24f07"
  brand-2-pressed: "#92430a"
  focus-ring: "rgba(217, 119, 6, .35)"
  accent-soft: "#fdf0e2"
  accent-ink: "#8a4708"
  chip-bg: "var(--brand-primary)"
  chip-ink: "var(--text-inverse)"
  shadow-card: "0 4px 16px rgba(69, 42, 15, .07)"
  shadow-card-hover: "0 12px 28px rgba(69, 42, 15, .18)"
  shadow-float: "0 1.5rem 3rem rgba(69, 42, 15, .28)"
  shadow-toast: "0 14px 34px rgba(69, 42, 15, .26)"
  toast-ring: "rgba(255, 255, 255, .9)"
  code-bg: "#241c14"
  code-ink: "#f0e6d8"
  terminal-ink: "#f0c674"
  media-bg: "#000000"
  paper: "#ffffff"
  checker-a: "#e0d8cc"
  checker-b: "#dad2c6"
  checker-bg: "#f4f0e9"
  overlay: "rgba(20, 12, 6, .6)"

# The dark half. Only the tokens that differ at night are listed.
dark:
  text-default: "#f5ede2"
  text-subtle-2: "#d6c9b8"
  text-subtle: "#a1937f"
  surface: "#17130f"
  surface-card: "#211b15"
  surface-muted: "#1c1712"
  line: "#362c22"
  line-strong: "#4d3f31"
  ok-soft: "#1a2410"
  ok-ink: "#c2e08a"
  danger-soft: "#2a1512"
  danger-ink: "#f4b8b8"
  danger-armed: "#ef4444"
  danger-text: "#f87171"
  warning-soft: "#2a1f10"
  warning-ink: "#f5c46b"
  info-soft: "#0f2429"
  info-ink: "#8fd3e3"
  success-soft: "#10291d"
  success-ink: "#a3d9bd"
  link: "#f59e0b"
  subtle-brand: "#2a2118"
  busy-soft: "#14100c"
  busy-ink: "#f0c674"
  subtle-light: "#1c1712"
  surface-input: "#1a1510"
  brand-pressed: "#f59e0b"
  brand-2-pressed: "#c2700b"
  focus-ring: "rgba(245, 158, 11, .40)"
  accent-soft: "#2e2015"
  accent-ink: "#f3c98a"
  chip-bg: "#5a3d1c"
  chip-ink: "#f5ede2"
  shadow-card: "0 4px 16px rgba(0, 0, 0, .40)"
  shadow-card-hover: "0 12px 28px rgba(0, 0, 0, .55)"
  shadow-float: "0 1.5rem 3rem rgba(0, 0, 0, .60)"
  shadow-toast: "0 14px 34px rgba(0, 0, 0, .55)"
  toast-ring: "rgba(0, 0, 0, .5)"
  checker-a: "#322820"
  checker-b: "#2c231b"
  checker-bg: "#1c1712"
  overlay: "rgba(0, 0, 0, .72)"
  ink: "var(--text-default)"
