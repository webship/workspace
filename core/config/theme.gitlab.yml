  line: "#4c4b51"
  line-strong: "#626168"
  link: "#63a6e9"
  brand-pressed: "#a989f5"
  brand-2-pressed: "#1b2b4d"
  focus-ring: "#63a6e966"
  ok-soft: "#0a4020"
  ok-ink: "#91d4a8"
  danger-soft: "#4b140b"
  danger-ink: "#f57f6c"
  danger-armed: "#e0466b"
  danger-text: "#ff8fa3"
  warning-soft: "#422800"
  warning-ink: "#e9be74"
  info-soft: "#0b2640"
  info-ink: "#9dc7f1"
  success-soft: "#10291d"
  success-ink: "#a3d9bd"
  busy-soft: "#1a2440"
