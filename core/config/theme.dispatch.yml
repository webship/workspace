# Dispatch — core/config/theme.dispatch.yml
#
# A style in the shape of Upsun Dispatch: OKLCH colour throughout, a violet primary, a lime accent,
# and Open Sans for text with Space Mono for code. The type is its scale — 36/30/24/20/18 with the
# line height tightening as the size grows, and tracking from -0.02em down.
#
# The colour values were read out of the product's own stylesheet rather than sampled from a
# screenshot, so they are the values it actually ships.
#
# The two families are NOT vendored here — nothing in public/vendor/fonts holds them — so a machine
# without them falls back through the stack. That is deliberate: a style is a set of values, and
# shipping two more typefaces to look like somebody else's product is a different decision.

name: Dispatch

tokens:
  brand-primary: "oklch(54.7% .257 280.028)"
  brand-secondary: "oklch(38.1% .171 280.684)"
  brand-accent: "oklch(92.8% .196 119.528)"
  brand-dark: "oklch(14.1% .004 285.823)"
  brand-light: "oklch(96.7% .001 286.375)"
  subtle-light: "oklch(96.7% .001 286.375)"
  subtle-brand: "oklch(97% .014 254.604)"
  subtle-accent: "oklch(98.2% .03 119.528)"
  text-default: "oklch(0% 0 0)"
  text-subtle: "oklch(55.2% .014 285.938)"
  text-inverse: "oklch(100% 0 0)"
  text-light: "#ebe8e5"
  text-brand: "var(--brand-primary)"
  text-accent: "var(--brand-accent)"
  font-primary: "Open Sans, \"Open Sans Variable\", ui-sans-serif, system-ui, \"Segoe UI\", Helvetica, Arial, sans-serif"
  font-secondary: "Open Sans, \"Open Sans Variable\", ui-sans-serif, system-ui, \"Segoe UI\", Helvetica, Arial, sans-serif"
  font-code: "\"Space Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  weight-regular: 400
  weight-semibold: 600
  leading-heading: 1.4
  leading-display: 1.3
  leading-body: 1.5
  tracking-wide: 0.0625em
  size-h1: 2.25rem
  size-h2: 1.875rem
  size-h3: 1.5rem
  size-h4: 1.25rem
  size-h5: 1.125rem
  size-h6: 0.8125rem
  size-body: 1.0625rem
  size-small: 0.875rem
  type-h1: "var(--weight-bold, 700) var(--size-h1)/1.1 var(--font-primary)"
  type-h2: "var(--weight-bold, 700) var(--size-h2)/1.15 var(--font-primary)"
  type-h3: "var(--weight-semibold) var(--size-h3)/1.25 var(--font-primary)"
  type-h4: "var(--weight-semibold) var(--size-h4)/1.3 var(--font-primary)"
  type-h5: "var(--weight-semibold) var(--size-h5)/1.35 var(--font-primary)"
  type-h6: "var(--weight-semibold) var(--size-h6)/1 var(--font-primary)"
  type-body: "var(--weight-regular) var(--size-body)/var(--leading-body) var(--font-primary)"
  type-body-sm: "var(--weight-regular) var(--size-small)/1.45 var(--font-primary)"
  type-label: "var(--weight-semibold) var(--size-body)/1 var(--font-primary)"
  type-caption: "var(--weight-regular) var(--size-small)/1.35 var(--font-primary)"
  type-mono: "var(--weight-regular) var(--size-body)/1.5 var(--font-code)"
  type-mono-sm: "var(--weight-regular) var(--size-small)/1.4 var(--font-code)"
  tracking-h1: -0.02em
  tracking-h2: -0.015em
  tracking-h3: -0.01em
  tracking-h4: -0.01em
  tracking-h5: -0.005em
  tracking-h6: 0.08em
