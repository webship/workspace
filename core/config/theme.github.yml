  text-default: "#f0f6fc"
  text-subtle-2: "#d1d7e0"
  text-subtle: "#9198a1"
  line: "#3d444d"
  line-strong: "#656c76"
  link: "#4493f8"
  brand-pressed: "#316dca"
  brand-2-pressed: "#1b2b4d"
  focus-ring: "#4493f866"
  ok-soft: "#0f2f1a"
  ok-ink: "#3fb950"
  danger-soft: "#3c1618"
  danger-ink: "#f85149"
  danger-armed: "#da3633"
  danger-text: "#ff7b72"
  warning-soft: "#3a2d12"
  warning-ink: "#d29922"
  info-soft: "#121d2f"
  info-ink: "#4493f8"
  success-soft: "#10291d"
  success-ink: "#a3d9bd"
  busy-soft: "#1a2440"
  busy-ink: "#b9c9ff"
  accent-soft: "#211f36"
  accent-ink: "#ab7df8"
  chip-bg: "#316dca"
