# The Node/Express app runs inside THIS container (as a web_extra_daemon,
# see config.yaml) rather than on the host, because this host's firewall
# blocks all docker-bridge -> host-port traffic (confirmed with a plain
# throwaway container too) — a container-to-host reverse proxy isn't
# reachable here. Docker-outside-of-Docker (docker.sock + the real
# ~/workspace tree bind-mounted in, see docker-compose.dood.yaml) gives
# this in-container process the same ddev/bash/host-path access it would
# have run natively. This vhost just proxies the ddev-router hop to the
# Node process on 127.0.0.1:3000 in the same container.
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name workspace.ddev.site *.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
