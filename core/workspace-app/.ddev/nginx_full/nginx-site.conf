# The Node/Express-style app runs inside THIS container (web_extra_daemon).
# Three vhost tiers:
#   1. <project>.<workspace>.workspace.ddev.site — cosmetic hierarchical
#      alias for a project's own site: proxied straight to the ddev-router
#      with the Host rewritten to <project>.ddev.site.
#   2. <workspace>.workspace.ddev.site — that workspace's dashboard page
#      (the Node app maps the host to the workspace).
#   3. workspace.ddev.site — the dashboard home.

# $connection_upgrade: "upgrade" while a request is upgrading, "close" otherwise. A
# websocket proxy needs it; a plain `Connection upgrade` on every request breaks keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tier 0: the Web IDE — code-server (VS Code in the browser) on its OWN hostname.
#
# A hostname and not a subpath: code-server is a single-page app that builds absolute
# URLs for its workers, its websocket and its static assets, and serving it under /ide/
# means rewriting all of them. Upstream's own guidance is a dedicated (sub)domain, and it
# costs nothing here — `*.workspace` is already in additional_hostnames, so DDEV's router
# routes ide.workspace.ddev.site and its certificate already covers it.
#
# An EXACT server_name, so it wins over the regex block below (nginx prefers an exact
# match to a regex however they are ordered) — otherwise these requests would go to the
# Node dashboard, which knows nothing about them.
server {
    listen 80;
    listen 443 ssl;
    server_name ide.workspace.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    # An IDE moves whole directories and opens large files.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The terminal, the extension host and the file watcher are all websockets.
        # Without these the editor loads and then hangs with "reconnecting…".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A build, a composer install or a long terminal command must not be cut off
        # mid-stream by a proxy read timeout.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}

# Tier 1: project passthrough (two labels before workspace.)
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<proj>[a-z0-9-]+)\.(?<ws>[a-z0-9_-]+)\.workspace\.ddev\.site$;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    # Resolve ddev-router at REQUEST time, not at startup: nginx resolves a
    # literal upstream host when it loads the config and refuses to start if
    # it cannot ("host not found in upstream"). On a cold Docker the router
    # does not exist yet -- ddev only starts it after this container is
    # healthy -- so a literal name deadlocks `ddev start`. A variable in
    # proxy_pass defers the lookup to Docker's embedded DNS per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ddev_router ddev-router;

    location / {
        # Resolve ddev-router at request time via Docker DNS — a literal
        # upstream is resolved at config load and kills nginx on cold start,
        # when ddev only launches the router after this container is healthy.
        resolver 127.0.0.11 valid=10s;
        set $ddev_router http://ddev-router:80;
        proxy_pass $ddev_router;
        proxy_http_version 1.1;
        proxy_set_header Host $proj.ddev.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://([a-z0-9-]+)\.ddev\.site(/.*)$ $scheme://$proj.$ws.workspace.ddev.site$2;
    }
}

# Tiers 2+3: the dashboard app (Node maps <ws>.workspace hosts itself)
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name workspace.ddev.site ~^[a-z0-9_-]+\.workspace\.ddev\.site$;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
