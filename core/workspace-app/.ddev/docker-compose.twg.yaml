# The Teamwork Graph CLI, shared FROM THE HOST instead of copied into the image:
# one binary, one OAuth session. Copying the config once split the rotating
# refresh token between two installations and each invalidated the other —
# mounting keeps a single owner, `twg login` on the host reaches the container
# instantly, and both survive image rebuilds.
#
# The BIN DIRECTORY is mounted, not the twg file itself, and that is the whole
# point of this shape. A single-file bind mount binds an INODE: `twg update`
# on the host writes a new file, the container keeps pointing at the old one,
# and the dashboard goes on running a version the server has stopped accepting
# — visible only as "Update required" inside a workitems list, with nothing
# saying the host binary was already current. Mounting the directory means the
# container resolves the name on every call, so an update is live immediately.
#
# /usr/local/bin/twg in the image is a wrapper that execs this (see
# .ddev/web-build/Dockerfile.workspace-app), so PATH still finds `twg` and a
# machine with no twg installed simply has nothing at the far end — which the
# dashboard's availability gate reports as absent. This also removes an old
# footgun: Docker CREATES a missing bind source, so the previous file mount
# made a root-owned DIRECTORY at ~/.local/bin/twg on a machine without twg,
# which then blocked installing it there.
services:
  web:
    volumes:
      - "${HOME}/.local/bin:/host-local-bin:ro"
      - "${HOME}/.config/twg:/home/${USER}/.config/twg:rw"
