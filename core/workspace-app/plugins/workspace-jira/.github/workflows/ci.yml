name: ci
on:
  push:
    branches: ['1.0.x']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The typed api lives in a private repository of the same organisation.
      - run: git config --global url."https://x-access-token:${{ secrets.WORKSPACE_PLUGINS_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: every shell script parses
        run: for f in scripts/*.sh; do bash -n "$f"; done
