  danger-armed: "#e0466b"
  danger-text: "#ff8fa3"
  warning-soft: "#9a6f1e"
  warning-ink: "#fcf4db"
  info-soft: "#302f45"
  info-ink: "#86b5ff"
  success-soft: "#10291d"
  success-ink: "#a3d9bd"
  busy-soft: "#1a2440"
  busy-ink: "#b9c9ff"
  accent-soft: "#4a495e"
